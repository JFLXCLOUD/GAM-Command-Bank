name: Build

# Builds the installer and the portable exe for every pull request, and
# tests the installer, so both can be tried before release.
# Download them from the run's "Artifacts" section.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: |
          python -m unittest discover -s tests -v
          node --test tests/web_core.test.js

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build portable exe and installer
        shell: pwsh
        run: ./tools/build_installer.ps1

      - name: Test installer (install, launch, uninstall)
        shell: pwsh
        run: ./tools/test_installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: GAM_Command_Bank-installer
          path: dist/GAM_Command_Bank_Setup_*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: GAM_Command_Bank-portable-exe
          path: dist/GAM_Command_Bank.exe
